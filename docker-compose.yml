services:
  denserradar:
    build:
      context: .
      dockerfile: Dockerfile
    image: denserradar:latest
    working_dir: /workspace
    stdin_open: true
    tty: true
    volumes:
      - ./:/workspace
    environment:
      - PYTHONPATH=/workspace/src
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
