# Esporta dati RADIal (o simili) nel layout atteso da DenserRadar: manifest + cartelle seq/radar|lidar|boxes
#
# Adatta:
#   - paths.source_root  → radice dataset grezzo (es. cartella con radar_FFT e laser_PCL)
#   - radar.target_shape → [D, R, E, A] DEVE coincidere con configs/radial_grid.yaml (o il tuo YAML train)
#   - calibration        → sostituisci identity con la tua calibrazione reale LiDAR→radar

output:
  root: exports/radial_denserradar
  sequence_id: radial_00
  manifest_filename: manifest.json
  subdirs:
    radar: radar
    lidar: lidar
    boxes: boxes

split:
  train_ratio: 0.9
  train_name: train
  val_name: val
  shuffle_seed: 42

frames:
  list_file: null
  # radar_RAED/ è la cartella prodotta da build_radial_raed_dataset.py
  discover_glob: "radar_RAED/raed_*.npy"
  frame_id_regex: 'raed_(\d+)\.npy$'
  sort_numeric: true

paths:
  source_root: /path/to/RADIal
  # I tensori RAED (R,D,E,A) vengono letti e permutati a (D,R,E,A) nello script
  radar_template: "radar_RAED/raed_{frame_id:06d}.npy"
  lidar_template: "laser_PCL/laser_PCL_{frame_id:06d}.npy"
  id_padding: 6

radar:
  # Shape finale [D, R, E, A] salvata per DenserRadar — da CalibrationTable RADIal
  target_shape: [256, 512, 11, 736]
  # raed_*.npy è (R, D, E, A) → permuta a (D, R, E, A) = DRAE
  source_layout: RDEA     # nuovo layout: lo script fa transpose(x,(1,0,2,3))
  resize_mode: none       # nessun resize: la shape è già quella corretta

lidar:
  columns_xyz: [0, 1, 2]
  skip_if_missing: false

calibration:
  lidar_to_radar: identity
  ego_pose: identity
  lidar_to_radar_npy: null
  ego_pose_npy: null

boxes:
  empty_list: true
