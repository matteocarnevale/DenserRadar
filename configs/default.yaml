seed: 42
device: cuda
num_workers: 4
pin_memory: true

# Dataset selection
# - manifest: expects a manifest.json + precomputed GT (original pipeline)
# - vod: expects VoD folder layout (lidar/*.bin, radar/*.bin, split/*.txt) and generates GT on-the-fly
data:
  dataset: manifest   # manifest | vod
  coordinates: spherical  # spherical | cartesian (affects metrics + point conversion)

radar:
  doppler_bins: 64
  range_bins: 256
  elevation_bins: 107
  azimuth_bins: 37
  range_min_m: 0.0
  range_max_m: 117.76
  elevation_min_deg: -53.0
  elevation_max_deg: 53.0
  azimuth_min_deg: -18.0
  azimuth_max_deg: 18.0
  intensity_reduce: max
  intensity_threshold_mode: percentile
  intensity_threshold_value: 85.0

ground_truth:
  mode: multi_frame_hard   # single_frame_hard | multi_frame_hard | multi_frame_soft
  temporal_window: 10
  remove_ground: true
  ground_ransac_iters: 100
  ground_distance_threshold_m: 0.15
  use_icp_refinement: false
  icp_max_correspondence_distance_m: 0.5
  outlier_radius_m: 0.4
  outlier_min_neighbors: 3
  high_res_factor: 2
  soft_sigma_voxels: 0.8
  crop_to_radar_fov: true
  dynamic_box_scale: 1.0
  box_z_padding_m: 0.2
  save_dense_points: true

model:
  base_channels: 16
  channel_multipliers: [1, 2, 4, 8]
  num_levels: 4
  use_cross_attention: true
  norm_groups: 8
  activation: silu
  dropout_p: 0.0

loss:
  use_deep_supervision: true
  lambda_focal: 700.0
  focal_alpha: 0.25
  focal_gamma: 2.0
  smooth: 1.0

training:
  epochs: 30
  batch_size: 1
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  grad_clip_norm: 1.0
  amp: true
  log_every_steps: 20
  save_every_epochs: 1
  synthetic_consistency_weight: 0.0
  teacher_checkpoint: null
  teacher_detach_gt: true
  train_split: train
  val_split: val
  max_train_steps_per_epoch: null
  max_val_steps: null

postprocess:
  pred_threshold: 0.5
  max_points: null

evaluation:
  rpcd_radius_m: 0.3
  rpca_radius_m: 0.5

# VoD / MSDNet-style bin layout (used when data.dataset == "vod")
vod:
  root: data/vod
  split: train                 # which split txt to read by default
  verify_files: true
  vod_sequence_filter: null    # null | "4drvo_net"
  radar_fov_deg: 120.0
  ground_height: -1.5
  elevation_grid_size_m: 0.5
  elevation_height_threshold_m: 0.3

  # Cartesian volume definition (meters)
  point_cloud_range: [0.0, -16.0, -2.0, 32.0, 16.0, 4.0]
  voxel_size: [0.1, 0.1, 0.15]           # used to define ds1 grid resolution
  radar_input_feature: max_intensity     # occupancy | max_intensity | count
